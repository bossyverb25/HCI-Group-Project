<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Invisible Interpreter</title>
  <link rel="stylesheet" href="static/style.css?v=10" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Bar: Thin Header & Clickable Mic Status Pill -->
    <header class="top-bar">
      <div class="brand">
        <span class="brand-title">Invisible Interpreter</span>
      </div>

      <div class="status-cluster">
        <div id="connection-badge" class="cache-badge">
          <span id="connection-state">Disconnected</span>
        </div>
        <button id="listening-pill" class="listening-pill off" type="button" aria-live="polite" title="Click to toggle microphone">
          <span id="red-dot" class="status-dot"></span>
          <span id="listening-label">Mic Off</span>
        </button>
      </div>
    </header>

    <!-- Everything below the title bar (blurred on initial load until mic is turned on) -->
    <div class="workspace-container">
      <div id="blur-target" class="workspace-content blurred">
        <!-- Main Stage -->
        <main class="stage">
          <!-- Live Context -->
          <section class="context-card" aria-label="Live spoken context">
            <span class="section-tag">LIVE CONTEXT</span>
            <p id="context-snippet" class="context-text placeholder">
              Listening for conversation...
            </p>
          </section>

          <!-- Suggestions Area -->
          <section class="suggestions-stage" aria-live="assertive">
            <!-- Idle state when user hasn't asked for help yet -->
            <div id="calm-idle-box" class="calm-idle-box">
              <p class="calm-desc">
                Press <strong>I'm Stuck</strong> whenever you need a hint. <span class="desktop-only">(Spacebar)</span>
              </p>
            </div>

            <!-- Vertical Suggestions Stack: Slightly bigger first bubble + vertical alternatives -->
            <div id="suggestions-list" class="suggestions-list hidden"></div>
          </section>
        </main>

        <!-- Bottom Controls: Pause Mic -> Collapsible Sliders -> Settings Bar -> I'm Stuck -->
        <footer class="bottom-controls">
          <!-- Pause Microphone Button (above Settings, with microphone SVG) -->
          <button id="btn-pause-mic" class="pause-mic-btn hidden" type="button">
            <svg class="mic-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" x2="12" y1="19" y2="22"/>
            </svg>
            <span>Pause microphone</span>
          </button>

          <!-- Collapsible Settings Menu with Sliders & Language (collapsed by default) -->
          <section id="settings-menu" class="settings-menu collapsed" aria-label="Suggestion settings">
            <div class="slider-row">
              <label for="suggestion-count-slider" class="slider-label">
                Suggestions: <strong id="suggestion-count-value">4</strong>
              </label>
              <input
                type="range"
                id="suggestion-count-slider"
                class="suggestion-slider"
                min="1"
                max="10"
                value="4"
              />
            </div>

            <div class="slider-row">
              <label for="detail-slider" class="slider-label">
                Detail: <strong id="detail-value">6</strong> words
              </label>
              <input
                type="range"
                id="detail-slider"
                class="suggestion-slider"
                min="1"
                max="12"
                value="6"
              />
            </div>

            <div class="slider-row">
              <label for="settings-language-select" class="slider-label">
                Language:
              </label>
              <select id="settings-language-select" class="language-select" aria-label="Language">
                <option value="english" selected>English</option>
                <option value="german">German</option>
                <option value="spanish">Spanish</option>
                <option value="czech">Czech</option>
                <option value="filipino">Filipino</option>
              </select>
            </div>
          </section>

          <!-- Single Long Bar Settings Button -->
          <button id="btn-settings" class="settings-bar-btn" type="button" aria-expanded="false">
            <span>Settings</span>
            <span id="settings-chevron" class="settings-chevron" aria-hidden="true">⌄</span>
          </button>

          <!-- Primary Action Button: I'm Stuck (or Turn Mic On when paused after suggestions) -->
          <button id="btn-primary-action" class="primary-action-btn" type="button">
            <span id="primary-action-text">I'm Stuck</span>
          </button>
        </footer>
      </div>

      <!-- Initial Blur Overlay: Language Selector + Big Turn On Microphone Button -->
      <div id="mic-overlay" class="mic-overlay">
        <div class="overlay-stack">
          <div class="overlay-lang-wrap">
            <span class="overlay-lang-label">Language</span>
            <select id="overlay-language-select" class="overlay-language-select" aria-label="Select language">
              <option value="english" selected>English</option>
              <option value="german">German</option>
              <option value="spanish">Spanish</option>
              <option value="czech">Czech</option>
              <option value="filipino">Filipino</option>
            </select>
          </div>

          <button id="btn-overlay-mic" class="overlay-mic-btn" type="button">
            <span class="overlay-mic-icon" aria-hidden="true">🎙️</span>
            <span>Turn On Microphone</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="static/app.js?v=8"></script>
</body>
</html>
