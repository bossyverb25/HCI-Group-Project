<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Invisible Interpreter — Prototype v1</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- Top Bar: Status & Privacy Indicator -->
    <header class="top-bar">
      <div class="brand">
        <span class="brand-title">The Invisible Interpreter</span>
      </div>

      <div class="status-cluster">
        <div id="connection-badge" class="cache-badge">
          <span id="connection-state">Disconnected</span>
        </div>
        <div id="listening-pill" class="listening-pill off" role="status" aria-live="polite">
          <span id="red-dot" class="status-dot"></span>
          <span id="listening-label">Mic Off (Paused)</span>
        </div>
      </div>
    </header>

    <!-- Main Stage -->
    <main class="stage">
      <!-- System 1: Last few words / current incomplete phrase -->
      <section class="context-card" aria-label="Live spoken context">
        <div class="section-header">
          <span class="section-tag">LIVE CONTEXT (LAST FEW WORDS)</span>
          <span id="stt-engine-badge" class="engine-badge">STT: faster-whisper (base.en)</span>
        </div>

        <p id="context-snippet" class="context-text placeholder">
          Press "Listening: ON" below and start speaking...
        </p>
      </section>

      <!-- System 3: Center Stage — Dynamic (1-10) Phrase Suggestions -->
      <section class="suggestions-stage" aria-live="assertive">
        <div class="suggestions-header">
          <span id="suggestion-mode-title" class="section-tag">
            SUGGESTIONS
          </span>
          <div class="meta-pills">
            <span id="llm-engine-badge" class="engine-badge">LLM: ollama (llama3.2:3b)</span>
          </div>
        </div>

        <!-- Idle state when user hasn't asked for help -->
        <div id="calm-idle-box" class="calm-idle-box">
          <p class="calm-desc">
            Press <strong>I'm Stuck</strong> whenever you need a hint. (Spacebar)
          </p>
        </div>

        <!-- Dynamic Suggestion Cards Grid (non-clickable display cards) -->
        <div id="suggestions-grid" class="suggestions-grid hidden"></div>
      </section>
    </main>

    <!-- Collapsible Settings Menu above the buttons (Hidden by default) -->
    <section id="settings-menu" class="settings-menu hidden" aria-label="Suggestion settings">
      <div class="slider-row">
        <label for="suggestion-count-slider" class="slider-label">
          Suggestions: <strong id="suggestion-count-value">6</strong>
        </label>
        <input
          type="range"
          id="suggestion-count-slider"
          class="suggestion-slider"
          min="1"
          max="10"
          value="6"
        />
      </div>

      <div class="slider-row">
        <label for="detail-slider" class="slider-label">
          Detail: <strong id="detail-value">6</strong> words
        </label>
        <input
          type="range"
          id="detail-slider"
          class="suggestion-slider"
          min="1"
          max="12"
          value="6"
        />
      </div>
    </section>

    <!-- Bottom Control Bar: Listening Toggle + I'm Stuck Button + Settings Icon Button -->
    <footer class="control-bar">
      <button id="btn-toggle-listen" class="ctrl-btn toggle-btn off" aria-pressed="false">
        <span class="btn-icon" id="toggle-icon">🎙️</span>
        <span class="btn-main" id="toggle-text">Listening: OFF</span>
      </button>

      <button id="btn-stuck" class="ctrl-btn stuck-btn phrases-btn">
        <span class="btn-icon" id="stuck-icon">💬</span>
        <span class="btn-main" id="stuck-text">I'm Stuck</span>
      </button>

      <button id="btn-settings" class="ctrl-btn settings-btn" aria-label="Settings" title="Settings">
        <span class="btn-icon">⚙️</span>
      </button>
    </footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
